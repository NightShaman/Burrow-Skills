name: Verify Burrow Skills development source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: burrow-skills-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immediately importable skill source
        run: |
          set -eu
          node --test verify-workflow.test.mjs
          count=$(find . -name SKILL.md -type f -size +0c | wc -l)
          [ "$count" -gt 0 ]
          [ "$count" -eq "$(find . -name SKILL.md -type f | wc -l)" ]
          git diff --check
